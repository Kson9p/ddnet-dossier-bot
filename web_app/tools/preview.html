<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Mobile preview</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #0b1118;
        display: grid;
        place-items: center;
        font-family: system-ui, sans-serif;
      }
      .phone {
        width: 390px;
        height: 844px;
        border-radius: 34px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.14);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.6);
        background: #17212b;
      }
      iframe {
        display: block;
        width: 390px;
        height: 844px;
        border: 0;
      }
    </style>
  </head>
  <body>
    <div class="phone">
      <iframe id="frame" src="/#/" title="Мобильный предпросмотр"></iframe>
    </div>
    <script>
      const params = new URLSearchParams(location.search);
      const route = params.get('route');
      if (route) document.getElementById('frame').src = `/${route}`;
    </script>
  </body>
</html>
